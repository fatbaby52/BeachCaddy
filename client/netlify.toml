[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Redirect API calls to Netlify Functions
[[redirects]]
  from = "/api/ai/chat"
  to = "/.netlify/functions/ai-chat"
  status = 200

[[redirects]]
  from = "/api/ai/suggestions"
  to = "/.netlify/functions/ai-suggestions"
  status = 200

[[redirects]]
  from = "/api/availability"
  to = "/.netlify/functions/get-availability"
  status = 200

[[redirects]]
  from = "/api/bookings"
  to = "/.netlify/functions/create-booking"
  status = 200

# SPA fallback - must be last
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
